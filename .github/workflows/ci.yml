name: CI Pipeline (Build + CodeLogic Scan)

on:
  push:
    branches:
      #- codelogic/**
      - renovate/**
  pull_request:
    branches:
      #- codelogic/**
      - renovate/**

concurrency:
  group: build-scan-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

env:
  APPLICATION_NAME: Vidly_MVCProject
  BUILD_CONFIGURATION: Release
  PROJECT_FILE: Vidly_MVCProject.csproj
  SOLUTION_FILE: Vidly_MVCProject.sln
  PUBLISH_OUTPUT: artifacts/out

jobs:
  build:
    name: Build .NET Framework app
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore and build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path "logs", "${{ env.PUBLISH_OUTPUT }}" | Out-Null
          $buildLog = Join-Path $env:GITHUB_WORKSPACE "logs/build.log"
          "BUILD_LOG=$buildLog" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Set-Content -Path $buildLog -Encoding utf8 -Value @(
            "========== CI build log =========="
            "Repository: ${{ github.repository }}"
            "Workflow: ${{ github.workflow }}  Run: ${{ github.run_id }}  Attempt: ${{ github.run_attempt }}"
            "Ref: ${{ github.ref }}  SHA: ${{ github.sha }}"
            "Runner OS: $env:RUNNER_OS"
            "========== Tool versions =========="
          )

          $projectPath = Join-Path $env:GITHUB_WORKSPACE "${{ env.PROJECT_FILE }}"
          [xml] $projectXml = Get-Content -Path $projectPath
          $namespaceManager = New-Object System.Xml.XmlNamespaceManager($projectXml.NameTable)
          $namespaceManager.AddNamespace("msb", "http://schemas.microsoft.com/developer/msbuild/2003")

          $removedItems = @()
          $contentNodes = @($projectXml.SelectNodes("//msb:Content[@Include]", $namespaceManager))
          foreach ($node in $contentNodes) {
            $include = $node.Include
            if ([string]::IsNullOrWhiteSpace($include) -or $include.Contains("*")) {
              continue
            }

            $contentPath = Join-Path $env:GITHUB_WORKSPACE $include
            if (Test-Path $contentPath) {
              continue
            }

            [void] $node.ParentNode.RemoveChild($node)
            $removedItems += $include
          }

          if ($removedItems.Count -gt 0) {
            $projectXml.Save($projectPath)
            Add-Content -Path $buildLog -Value "Removed missing Content items from CI project copy: $($removedItems -join ', ')"
          }

          function Invoke-LoggedNative {
            param(
              [Parameter(Mandatory = $true)]
              [string] $Title,
              [Parameter(Mandatory = $true)]
              [string] $FilePath,
              [Parameter(Mandatory = $true)]
              [string[]] $Arguments
            )

            Add-Content -Path $buildLog -Value "========== $Title =========="
            & $FilePath @Arguments 2>&1 | Tee-Object -FilePath $buildLog -Append
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0) {
              throw "$Title failed with exit code $exitCode"
            }
          }

          Invoke-LoggedNative "nuget help" "nuget" @("help")
          Invoke-LoggedNative "msbuild version" "msbuild" @("-version")

          Invoke-LoggedNative "NuGet restore" "nuget" @(
            "restore",
            "${{ env.SOLUTION_FILE }}",
            "-NonInteractive",
            "-Verbosity",
            "normal"
          )

          $publishUrl = Join-Path $env:GITHUB_WORKSPACE "${{ env.PUBLISH_OUTPUT }}"

          Invoke-LoggedNative "MSBuild publish" "msbuild" @(
            "${{ env.PROJECT_FILE }}",
            "/m",
            "/p:Configuration=${{ env.BUILD_CONFIGURATION }}",
            "/p:Platform=AnyCPU",
            "/p:DeployOnBuild=true",
            "/p:WebPublishMethod=FileSystem",
            "/p:DeleteExistingFiles=true",
            "/p:ExcludeApp_Data=true",
            "/p:PublishUrl=$publishUrl",
            "/p:VisualStudioVersion=17.0",
            "/p:TreatWarningsAsErrors=false"
          )

          $publishedFiles = @(Get-ChildItem -Path $publishUrl -Recurse -File -ErrorAction SilentlyContinue)
          if ($publishedFiles.Count -eq 0) {
            $packageTmp = Join-Path $env:GITHUB_WORKSPACE "obj/${{ env.BUILD_CONFIGURATION }}/Package/PackageTmp"
            Add-Content -Path $buildLog -Value "PublishUrl was empty; checking MSBuild package staging output at $packageTmp"

            if (Test-Path $packageTmp) {
              Copy-Item -Path (Join-Path $packageTmp "*") -Destination $publishUrl -Recurse -Force
              Add-Content -Path $buildLog -Value "Copied MSBuild package staging output to $publishUrl"
            }
          }

          $publishedFiles = @(Get-ChildItem -Path $publishUrl -Recurse -File -ErrorAction SilentlyContinue)
          if ($publishedFiles.Count -eq 0) {
            throw "MSBuild completed, but no publish output was found in $publishUrl"
          }

          Add-Content -Path $buildLog -Value "========== Publish output =========="
          Get-ChildItem -Path $publishUrl -Recurse | Select-Object -First 200 FullName | Out-String | Add-Content -Path $buildLog

      - name: Upload publish output
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-framework-publish
          path: ${{ env.PUBLISH_OUTPUT }}
          if-no-files-found: error

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-build-log
          path: logs/build.log
          if-no-files-found: ignore
          retention-days: 14

  codelogic:
    name: CodeLogic Scan
    runs-on: ubuntu-latest
    needs: build
    if: always()

    permissions:
      contents: read

    env:
      CODELOGIC_HOST: ${{ vars.CODELOGIC_HOST || secrets.CODELOGIC_HOST }}
      AGENT_UUID: ${{ secrets.AGENT_UUID }}
      AGENT_PASSWORD: ${{ secrets.AGENT_PASSWORD }}
      SCAN_SPACE_NAME: ${{ vars.CODELOGIC_SCAN_SPACE_NAME || 'MVCProject' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CodeLogic configuration
        id: codelogic-config
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${CODELOGIC_HOST}" && -n "${AGENT_UUID}" && -n "${AGENT_PASSWORD}" ]]; then
            echo "configured=true" >> "${GITHUB_OUTPUT}"
            echo "CodeLogic credentials are configured."
          else
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "CodeLogic credentials are not configured; scan and build-info steps will be skipped."
          fi

      - name: Download publish output
        if: needs.build.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: dotnet-framework-publish
          path: ${{ env.PUBLISH_OUTPUT }}

      - name: Download build log
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: dotnet-build-log
          path: logs

      - name: Run CodeLogic Scan
        id: codelogic-scan
        if: needs.build.result == 'success' && steps.codelogic-config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail

          image_host="${CODELOGIC_HOST#https://}"
          image_host="${image_host#http://}"
          image_host="${image_host%/}"
          publish_dir="${GITHUB_WORKSPACE}/${{ env.PUBLISH_OUTPUT }}"
          mkdir -p "${GITHUB_WORKSPACE}/logs"
          scan_log="${GITHUB_WORKSPACE}/logs/codelogic-scan.log"
          : > "${scan_log}"

          set +e
          docker run --pull always --rm \
            -e CODELOGIC_HOST \
            -e AGENT_UUID \
            -e AGENT_PASSWORD \
            -v "${publish_dir}:/scan:ro" \
            "${image_host}/codelogic_dotnet:latest" analyze \
              --application "${{ env.APPLICATION_NAME }}" \
              --path /scan \
              --scan-space-name "${SCAN_SPACE_NAME}" \
              -f Vidly_MVCProject.dll \
              -m Vidly_MVCProject \
              --expunge-scan-sessions \
            2>&1 | tee -a "${scan_log}"
          scan_exit="${PIPESTATUS[0]}"
          set -e
          exit "${scan_exit}"

      - name: Prepare combined pipeline log for CodeLogic
        if: always() && steps.codelogic-config.outputs.configured == 'true'
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          SCAN_OUTCOME: ${{ steps.codelogic-scan.outcome }}
        shell: bash
        run: |
          set -euo pipefail

          SCAN_OUTCOME="${SCAN_OUTCOME:-skipped}"

          mkdir -p "${GITHUB_WORKSPACE}/logs"
          build_log="${GITHUB_WORKSPACE}/logs/build.log"
          scan_log="${GITHUB_WORKSPACE}/logs/codelogic-scan.log"

          if [[ ! -s "${build_log}" ]]; then
            {
              echo "WARNING: logs/build.log was missing or empty before pipeline summary was appended."
              echo "Typical causes: build job failed before the log was written, or the build-log artifact was not produced."
              echo "Build job result: ${BUILD_RESULT}"
            } > "${build_log}"
          fi

          {
            echo ""
            echo "========== Pipeline status (CodeLogic job) =========="
            echo "Summary generated at (UTC): $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo ""
            echo "--- Workflow / run metadata ---"
            echo "repository: ${{ github.repository }}"
            echo "workflow: ${{ github.workflow }}"
            echo "run_id: ${{ github.run_id }}  run_attempt: ${{ github.run_attempt }}  run_number: ${{ github.run_number }}"
            echo "run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "event: ${{ github.event_name }}  actor: ${{ github.actor }}  triggering_actor: ${{ github.triggering_actor }}"
            echo "ref: ${{ github.ref }}  sha: ${{ github.sha }}"
            echo "workflow_ref: ${{ github.workflow_ref }}  workflow_sha: ${{ github.workflow_sha }}"
            echo "runner: ${RUNNER_OS:-} ${RUNNER_ARCH:-}  job: ${GITHUB_JOB:-}"
            echo "head_ref (PR): ${{ github.head_ref }}"
            echo "base_ref (PR): ${{ github.base_ref }}"
            echo ""
            echo "--- Job / step results ---"
            echo "build job (needs.build): ${BUILD_RESULT}"
            echo "CodeLogic scan step outcome: ${SCAN_OUTCOME}"
            echo ""
            echo "--- Failure / skip hints ---"
          } >> "${build_log}"

          case "${BUILD_RESULT}" in
            success) ;;
            failure)
              echo "Build job reported failure. See MSBuild/NuGet sections above in this log (from the Windows build job)." >> "${build_log}"
              ;;
            cancelled)
              echo "Build job was cancelled." >> "${build_log}"
              ;;
            skipped)
              echo "Build job was skipped (workflow conditions or upstream)." >> "${build_log}"
              ;;
            *)
              echo "Build job result: ${BUILD_RESULT}" >> "${build_log}"
              ;;
          esac

          if [[ "${BUILD_RESULT}" == "success" ]]; then
            case "${SCAN_OUTCOME}" in
              failure)
                echo "CodeLogic scan step failed. See CodeLogic scan log section below (docker analyze output)." >> "${build_log}"
                ;;
              cancelled)
                echo "CodeLogic scan step was cancelled." >> "${build_log}"
                ;;
              skipped)
                echo "CodeLogic scan step was skipped (e.g. credentials not configured at evaluate time, or build not successful)." >> "${build_log}"
                ;;
              success) ;;
              *)
                echo "CodeLogic scan step outcome: ${SCAN_OUTCOME}" >> "${build_log}"
                ;;
            esac
          fi

          if [[ -s "${scan_log}" ]]; then
            {
              echo ""
              echo "========== CodeLogic scan log (docker analyze) =========="
            } >> "${build_log}"
            cat "${scan_log}" >> "${build_log}"
          fi

      - name: Send Build Info
        if: always() && steps.codelogic-config.outputs.configured == 'true'
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          SCAN_OUTCOME: ${{ steps.codelogic-scan.outcome }}
        shell: bash
        run: |
          set -euo pipefail

          SCAN_OUTCOME="${SCAN_OUTCOME:-skipped}"

          mkdir -p "${GITHUB_WORKSPACE}/logs"
          build_log="${GITHUB_WORKSPACE}/logs/build.log"
          if [[ ! -s "${build_log}" ]]; then
            {
              echo "WARNING: logs/build.log was missing or empty when send_build_info ran."
              echo "Build job result: ${BUILD_RESULT}"
              echo "CodeLogic scan step outcome: ${SCAN_OUTCOME}"
              echo "Check earlier workflow steps for checkout, restore, MSBuild, scan, or prepare-pipeline-log failures."
            } > "${build_log}"
          fi

          if [[ "${BUILD_RESULT}" == "success" ]]; then
            case "${SCAN_OUTCOME}" in
              failure) BUILD_STATUS="FAILURE" ;;
              cancelled) BUILD_STATUS="CANCELLED" ;;
              success) BUILD_STATUS="SUCCESS" ;;
              skipped) BUILD_STATUS="SKIPPED" ;;
              *) BUILD_STATUS="${SCAN_OUTCOME^^}" ;;
            esac
          else
            case "${BUILD_RESULT}" in
              failure) BUILD_STATUS="FAILURE" ;;
              cancelled) BUILD_STATUS="CANCELLED" ;;
              skipped) BUILD_STATUS="SKIPPED" ;;
              *) BUILD_STATUS="${BUILD_RESULT^^}" ;;
            esac
          fi

          image_host="${CODELOGIC_HOST#https://}"
          image_host="${image_host#http://}"
          image_host="${image_host%/}"

          docker run --pull always --rm \
            -e CODELOGIC_HOST \
            -e AGENT_UUID \
            -e AGENT_PASSWORD \
            -v "${GITHUB_WORKSPACE}:/scan" \
            -v "${GITHUB_WORKSPACE}/logs:/log_file_path" \
            "${image_host}/codelogic_dotnet:latest" send_build_info \
              --agent-uuid="${AGENT_UUID}" \
              --agent-password="${AGENT_PASSWORD}" \
              --server="${CODELOGIC_HOST}" \
              --path=/scan \
              --build-number="${{ github.run_number }}" \
              --pipeline-system="GitHub Actions" \
              --job-name="${{ github.repository }} - ${{ github.workflow }}" \
              --build-status="${BUILD_STATUS}" \
              --log-file=/log_file_path/build.log \
              --log-lines=50000 \
              --timeout=300 \
              --verbose

      - name: CodeLogic CI summary
        if: always()
        shell: bash
        run: |
          {
            echo "## CodeLogic CI"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Repository | \`${{ github.repository }}\` |"
            echo "| Workflow | \`${{ github.workflow }}\` |"
            echo "| Run | ${{ github.run_id }} (attempt ${{ github.run_attempt }}) |"
            echo "| Run URL | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
            echo "| Ref | \`${{ github.ref }}\` |"
            echo "| SHA | \`${{ github.sha }}\` |"
            echo "| Build job result | **${{ needs.build.result }}** |"
            echo "| CodeLogic scan step | \`${{ steps.codelogic-scan.outcome }}\` |"
            echo "| CodeLogic configured | \`${{ steps.codelogic-config.outputs.configured }}\` |"
            echo ""
            echo "CodeLogic scans the published build output when credentials are configured and the build succeeds. Build info sends a combined log (Windows build log plus pipeline metadata, scan outcome, and \`docker analyze\` output when present)."
          } >> "${GITHUB_STEP_SUMMARY}"
